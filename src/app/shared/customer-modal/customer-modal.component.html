<div class="modal-overlay" *ngIf="visible">
  <div class="modal-content" >

    <div class="modal-header">
      <h3>{{ editingCustomer ? 'Sửa khách hàng' : 'Tạo khách hàng' }}</h3>
      <button class="modal-close" (click)="closeModal()">✕</button>
    </div>

    <div class="modal-body">
      <form #customerForm="ngForm" class="modal-form">

        <!-- Nhóm khách hàng và Mã -->
        <div class="form-row">
          <div class="form-field">
            <label>Nhóm khách hàng <span class="required">*</span></label>
            
<div class="custom-group-select" [class.open]="showCustomerGroupDropdown">
  <div class="select-header" (click)="showCustomerGroupDropdown = !showCustomerGroupDropdown">
    <span class="selected-value">{{ getCustomerSelectedGroupText() }}</span>
    <i class="pi pi-angle-down select-arrow"></i>
    <button class="group-add-btn" type="button" (click)="openAddGroup(); $event.stopPropagation()">
      <i class="pi pi-plus-circle"></i>
    </button>
  </div>

  <div class="select-options" *ngIf="showCustomerGroupDropdown">
    <div class="select-option" (click)="customer.groupID = undefined; showCustomerGroupDropdown = false">
      <span class="option-text">Chọn nhóm</span>
    </div>
    <div *ngFor="let group of groups" class="select-option with-edit">
      <span class="option-text" (click)="customer.groupID = group.id; showCustomerGroupDropdown = false">
        {{ group.code }} - {{ group.name }}
      </span>
      <button class="option-edit-btn" type="button" (click)="editCustomerGroup(group, $event)" title="Sửa nhóm">
        <i class="pi pi-pencil"></i>
      </button>
    </div>
  </div>
</div>
            
                   <div class="error-message" *ngIf="!customer.groupID && submitted">
                <small><i class="pi pi-info-circle"></i>Vui lòng chọn nhóm khách hàng</small>
                    </div>
          </div>

          <div class="form-field">
            <label>Mã nhóm</label>
            <input 
              [value]="customer.code || 'Tự động sinh'" 
              disabled 
              class="readonly-input"
              placeholder="Tự động sinh sau khi lưu"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>Họ và tên <span class="required">*</span></label>
            <input [(ngModel)]="customer.name" 
                   name="name"
                   #name="ngModel"
                   autocomplete="off"
                   required>
            <div class="error-message" *ngIf="name.invalid && (name.dirty || name.touched || submitted)">
              <small *ngIf="name.errors?.['required']"><i class="pi pi-info-circle"></i> Vui lòng nhập họ và tên</small>
            </div>
          </div>

          <div class="form-field">
            <label>Số điện thoại</label>
            <input [(ngModel)]="customer.phone" 
                   autocomplete="off"
                   name="phone"
                   (blur)="validatePhone()"
                   (input)="phoneError = ''"
                   maxlength="10">
            <!-- ← THÊM hiển thị lỗi SĐT -->
            <div class="error-message" *ngIf="phoneError">
              <small><i class="pi pi-info-circle"></i> {{ phoneError }}</small>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>Mã số thuế</label>
            <input [(ngModel)]="customer.taxCode" name="taxCode" autocomplete="off" (blur)="validateTaxCode()" (input)="taxCodeError = ''">
                <div class="error-message" *ngIf="taxCodeError">
              <small><i class="pi pi-info-circle"></i> {{ taxCodeError }}</small>
            </div>
          </div>

          <div class="form-field">
            <label>CCCD/CMND</label>
            <input [(ngModel)]="customer.cccd" 
                   name="cccd"
                   (blur)="validateCCCD()"
                   (input)="cccdError = ''"
                   maxlength="12"
                   autocomplete="off"
                  >
            <!-- ← THÊM hiển thị lỗi CCCD -->
            <div class="error-message" *ngIf="cccdError">
              <small><i class="pi pi-info-circle"></i> {{ cccdError }}</small>
            </div>
          </div>
        </div>

        <div class="form-field full-width">
          <label>Email</label>
          <input 
           type="email" 
           [(ngModel)]="customer.email" 
           name="email"
          (blur)="validateEmail()"
           autocomplete="off"
           class="form-control">
                                 
            <div class="error-message" *ngIf="emailError">
              <small><i class="pi pi-info-circle"></i> {{ emailError }}</small>
            </div>
        </div>

        <div class="form-field full-width">
          <label>Địa chỉ</label>
          <textarea [(ngModel)]="customer.address" name="address"></textarea>
        </div>

      </form>
    </div>

    <div class="modal-footer">
            <button class="modal-btn save" (click)="saveModal()">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13 4L6 11L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
         Lưu
      </button>
      <button class="modal-btn cancel" (click)="closeModal()">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Đóng</button>

    </div>

  </div>
</div>

<app-group-modal 
  [show]="showGroupModal"
  [group]="editingGroup"
  [groupType]="'customer'"
  (closeModal)="handleCloseGroupModal()"
  (onSubmit)="handleSubmitGroup($event)"
  (onDelete)="handleDeleteGroup($event)"
></app-group-modal>
